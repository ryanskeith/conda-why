name: conda-why tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Create test environment
        run: |
          conda create -y -q -n test -c conda-forge --override-channels \
            "python=${{ matrix.python-version }}" \
            "conda>=26.10" \
            "conda-rattler-solver>=26.10,<27" \
            pip setuptools

      - name: Install dev tools
        run: conda install -y -q -n test --file requirements.dev.txt

      - name: Install plugin
        run: conda run -n test python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: conda run -n test python -m pytest
